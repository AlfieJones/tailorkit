name: Deploy asset infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes or deploy
        type: choice
        options: [diff, deploy]
        default: diff
        required: true
      stage:
        description: Infrastructure environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

concurrency:
  group: assets-infra-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    # Only reviewed code from main can access deployment credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.stage == 'production' && 'production-platform' || 'staging-platform' }}
    env:
      CI: true
      SST_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      ASSET_STAGE: ${{ inputs.stage }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      ASSET_DOMAIN: ${{ vars.ASSET_DOMAIN }}
      PLATFORM_ORIGIN: ${{ vars.PLATFORM_ORIGIN }}
      ASSET_TLS_VERIFIED: ${{ vars.ASSET_TLS_VERIFIED }}
      ASSET_DNS_RECORD_ID: ${{ vars.ASSET_DNS_RECORD_ID }}
      ASSET_WORKER_ROUTE_ID: ${{ vars.ASSET_WORKER_ROUTE_ID }}
      ASSET_IMPORT_WORKER: ${{ vars.ASSET_IMPORT_WORKER }}
      ASSET_VERCEL_PROJECT_ID: ${{ vars.ASSET_VERCEL_PROJECT_ID }}
      ASSET_VERCEL_TEAM_ID: ${{ vars.ASSET_VERCEL_TEAM_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ASSET_GATEWAY_SECRET: ${{ secrets.ASSET_GATEWAY_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 24
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Validate deployment configuration
        run: node infra/command.ts validate "$ASSET_STAGE"
      - name: Test infrastructure and gateway
        run: vp exec turbo run test check-types --filter=@tailorkit/infra --filter=@tailorkit/assets
      - name: Show infrastructure changes
        run: vp run infra:diff -- --stage "$ASSET_STAGE"
      - name: Deploy through SST
        if: inputs.operation == 'deploy'
        run: vp run infra:deploy -- --stage "$ASSET_STAGE"
      - name: Sync server-side Vercel settings
        if: inputs.operation == 'deploy'
        run: node infra/command.ts sync-vercel "$ASSET_STAGE"
      - name: Record next rollout step
        if: inputs.operation == 'deploy'
        run: |
          echo "Asset infrastructure and Vercel environment settings updated." >> "$GITHUB_STEP_SUMMARY"
          echo "Redeploy the matching platform backend to consume the updated settings. Existing deployments are unchanged." >> "$GITHUB_STEP_SUMMARY"
          echo "On first rollout, apply the public-team-ID migration before that platform deployment." >> "$GITHUB_STEP_SUMMARY"
