name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  TAILORKIT_OTEL_DISABLED: true
  OTEL_SDK_DISABLED: true

jobs:
  quality:
    name: Lint, Format and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Lint
        run: vp run lint

      - name: Format
        run: vp run format

      - name: Typecheck
        run: vp run check-types

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-tests-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-tests-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run tests
        run: vp run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run build
