name: Run database migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/db/src/migrations/**"

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production-platform
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty. Add PRODUCTION_MIGRATION_DATABASE_URL to the production-platform GitHub Environment."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}

      - name: Run Drizzle migrations
        run: pnpm turbo run db:migrate --filter=@tailorkit/db
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
