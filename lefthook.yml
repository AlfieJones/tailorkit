# Lefthook configuration
# https://github.com/evilmartians/lefthook
pre-commit:
  parallel: false
  jobs:
    - name: oxlint
      run: pnpm exec oxlint --fix {staged_files} || true
      stage_fixed: true

    - name: oxfmt
      run: pnpm exec oxfmt --write {staged_files} || true
      stage_fixed: true
