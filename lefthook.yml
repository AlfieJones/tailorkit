pre-commit:
  parallel: false
  jobs:
    - name: sherif
      run: pnpm sherif:fix || true
      stage_fixed: true

    - name: oxlint
      run: pnpm exec oxlint --fix {staged_files} || true
      stage_fixed: true

    - name: oxfmt
      run: pnpm exec oxfmt --write {staged_files} || true
      stage_fixed: true
